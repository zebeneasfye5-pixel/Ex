<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="6" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="24 12" opacity="0.6" />
  
  <!-- Central Emblem: Stylized Diamond / Nexus "N" -->
  <path d="M176 360 V152 L336 360 V152" fill="none" stroke="url(#goldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Small Center Nexus Accent -->
  <circle cx="256" cy="256" r="18" fill="#10b981" />
</svg>
